name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate website catalog from repository indexes
        run: node scripts/build-site.mjs
      - name: Validate published site
        run: |
          test -s docs/index.html
          test -s docs/robots.txt
          test -s docs/sitemap.xml
          test -s docs/llms.txt
          grep -q 'rel="canonical"' docs/index.html
          grep -q 'application/ld+json' docs/index.html
          grep -q 'Indexed agent skills' docs/index.html
          grep -q 'Indexed engineering gates' docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
