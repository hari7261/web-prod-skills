name: CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run evals
      - run: npm run report
      - name: Syntax-check all gate runners and scripts
        run: |
          find gates scripts evals -path '*/fixtures/*' -prune -o -name '*.mjs' -print0 | xargs -0 -n1 node --check
          bash -n install.sh
